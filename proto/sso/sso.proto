syntax = "proto3";

package auth;

option go_package = "siastfu.sso.v1;ssov1";

service Auth {
  rpc Registered (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
  int64 tg_user_id = 1;
}
message RegisterResponse {
  int64 user_id = 1;
}

message LoginRequest {
  int64 tg_user_id = 1;
}
message LoginResponse {
  string token = 1;
}
